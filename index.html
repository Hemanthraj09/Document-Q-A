<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Q&A - LangFlow Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Monochrome Minimalist Theme */
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: rgba(59, 130, 246, 0.1);
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --bg-elevated: #1a1a1a;
            --bg-input: #0d0d0d;
            --text-primary: #fafafa;
            --text-secondary: #a1a1a1;
            --text-muted: #6b6b6b;
            --border: #262626;
            --border-hover: #404040;
            --success: #22c55e;
            --error: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

        /* Landing Page */
        .landing {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .landing.hidden { display: none; }

        .logo { 
            font-size: 3rem; 
            margin-bottom: 1rem;
            width: 72px;
            height: 72px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle { color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 2.5rem; font-weight: 400; }

        .input-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 700px;
            width: 100%;
        }

        .input-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .input-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .input-card h3 {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #textInput {
            width: 100%;
            min-height: 120px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 1rem;
            transition: border-color 0.2s ease;
        }

        #textInput:focus { 
            outline: none; 
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        #textInput::placeholder { color: var(--text-muted); }

        .upload-zone {
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-input);
        }

        .upload-zone:hover { 
            border-color: var(--primary); 
            background: var(--primary-light); 
        }
        
        .upload-zone.dragover { 
            border-color: var(--primary); 
            background: var(--primary-light);
            border-style: solid;
        }

        .upload-icon { 
            font-size: 1.75rem; 
            margin-bottom: 0.5rem;
            opacity: 0.7;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover:not(:disabled) { 
            background: var(--primary-hover);
            box-shadow: var(--shadow-md);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Chat Page */
        .chat-page { display: none; min-height: 100vh; background: var(--bg-main); }
        .chat-page.active { display: flex; flex-direction: column; }

        .chat-header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
        }

        .chat-title { 
            font-size: 1rem; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem;
            color: var(--text-primary);
        }
        
        .btn-back {
            padding: 0.5rem 1rem;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn-back:hover { 
            border-color: var(--border-hover); 
            color: var(--text-primary);
            background: var(--bg-elevated);
        }

        .chat-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message { display: flex; gap: 0.75rem; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
        }

        .user-avatar { 
            background: var(--primary);
            border-color: var(--primary);
        }
        .ai-avatar { 
            background: var(--bg-elevated);
        }

        .message-content {
            flex: 1;
            background: var(--bg-card);
            padding: 0.875rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            line-height: 1.6;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: var(--text-primary);
        }

        .message-content.error { 
            border-color: var(--error); 
            background: rgba(239, 68, 68, 0.1); 
        }
        .message-content.context { 
            border-color: var(--border); 
            background: var(--bg-elevated); 
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .input-area {
            padding: 1rem;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            border-radius: 12px;
            margin: 0.5rem;
            box-shadow: var(--shadow-sm);
        }

        .input-wrapper { display: flex; gap: 0.75rem; }

        #messageInput {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        #messageInput:focus { 
            outline: none; 
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        #messageInput::placeholder { color: var(--text-muted); }

        .send-btn {
            padding: 0.75rem 1.25rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .send-btn:hover:not(:disabled) { 
            background: var(--primary-hover);
        }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status { 
            text-align: center; 
            padding: 0.5rem; 
            font-size: 0.75rem; 
            color: var(--text-muted);
            font-weight: 500;
        }
        .status.connected { color: var(--success); }
        .status.disconnected { color: var(--error); }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        @media (max-width: 700px) {
            .input-options { grid-template-columns: 1fr; }
            h1 { font-size: 1.75rem; }
            .logo { width: 56px; height: 56px; font-size: 2rem; }
        }
    </style>
</head>
<body>
    <!-- Landing Page -->
    <div class="container landing" id="landing">
        <div class="logo">📄</div>
        <h1>Document Q&A</h1>
        <p class="subtitle">Powered by LangFlow RAG Pipeline</p>

        <div class="input-options">
            <div class="input-card">
                <h3>📝 Paste Text</h3>
                <textarea id="textInput" placeholder="Paste your content here..."></textarea>
                <button class="btn" id="analyzeTextBtn">Start Chat</button>
            </div>

            <div class="input-card">
                <h3>📄 Upload PDF</h3>
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">📁</div>
                    <div style="color: var(--text-secondary); font-size: 0.85rem;">
                        Drag & drop PDF here<br>or click to browse
                    </div>
                    <input type="file" id="fileInput" accept=".pdf,.txt" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Page -->
    <div class="chat-page" id="chatPage">
        <div class="chat-header">
            <div class="chat-title">💬 Document Q&A</div>
            <button class="btn-back" id="backBtn">← New Document</button>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages"></div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Ask a question about the document..." autofocus>
                    <button class="send-btn" id="sendBtn">Send</button>
                </div>
            </div>

            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let documentContext = '';

        const landing = document.getElementById('landing');
        const chatPage = document.getElementById('chatPage');
        const messages = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');

        // Text analysis
        document.getElementById('analyzeTextBtn').addEventListener('click', () => {
            const text = document.getElementById('textInput').value.trim();
            if (text.length < 20) {
                alert('Please enter at least 20 characters of text.');
                return;
            }
            documentContext = text;
            startChat('Text content loaded');
        });

        // File upload
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => { e.preventDefault(); uploadZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        async function handleFile(file) {
            if (!file) return;
            
            uploadZone.innerHTML = '<div class="loading"></div> Reading file...';
            
            try {
                if (file.name.endsWith('.txt')) {
                    const text = await file.text();
                    documentContext = text;
                    startChat(`File loaded: ${file.name}`);
                } else if (file.name.endsWith('.pdf')) {
                    // Upload PDF to backend for text extraction
                    const formData = new FormData();
                    formData.append('file', file);
                    
                    const response = await fetch('/upload-pdf', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'PDF upload failed');
                    }
                    
                    const data = await response.json();
                    documentContext = data.text;
                    startChat(`PDF loaded: ${file.name} (${data.pages} pages, ${data.chars} chars)`);
                } else {
                    throw new Error('Please upload a PDF or TXT file.');
                }
            } catch (error) {
                uploadZone.innerHTML = '<div class="upload-icon">📁</div><div style="color: var(--text-secondary); font-size: 0.85rem;">Drag & drop PDF here<br>or click to browse</div>';
                alert(error.message);
            }
        }

        function startChat(contextMessage) {
            landing.classList.add('hidden');
            chatPage.classList.add('active');
            messages.innerHTML = '';
            // Generate a completely unique UUID-style session ID to force LangFlow to start fresh
            // This prevents any context bleeding from previous documents
            sessionId = crypto.randomUUID();
            
            // Show context indicator
            addMessage('system', `📎 ${contextMessage} (${documentContext.length > 100 ? documentContext.length + ' chars' : 'ready'})`);
            addMessage('ai', 'Document loaded! Ask me any questions about the content.');
            
            status.textContent = '✓ Ready';
            status.className = 'status connected';
            messageInput.focus();
        }

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            chatPage.classList.remove('active');
            landing.classList.remove('hidden');
            document.getElementById('textInput').value = '';
            document.getElementById('uploadZone').innerHTML = '<div class="upload-icon">📁</div><div style="color: var(--text-secondary); font-size: 0.85rem;">Drag & drop PDF here<br>or click to browse</div>';
            documentContext = '';
            sessionId = null;  // Force a new session for the next document
        });

        // Send message
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        async function sendMessage() {
            const question = messageInput.value.trim();
            if (!question) return;

            addMessage('user', question);
            messageInput.value = '';
            sendBtn.disabled = true;

            const loadingId = addMessage('ai', '<div class="loading"></div> Thinking...', true);

            // Always include document context with every question
            // This ensures LangFlow always has the correct context
            const fullQuestion = `Based on this document:\n---\n${documentContext.substring(0, 4000)}\n---\n\nQuestion: ${question}`;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: fullQuestion, session_id: sessionId })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (response.ok) {
                    sessionId = data.session_id;
                    addMessage('ai', data.answer);
                    status.textContent = '✓ Connected';
                    status.className = 'status connected';
                } else {
                    addMessage('ai', `Error: ${data.detail || 'Unknown error'}`, false, true);
                    status.textContent = '✗ Error';
                    status.className = 'status disconnected';
                }
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                addMessage('ai', 'Failed to connect. Is LangFlow running on port 7860?', false, true);
                status.textContent = '✗ Connection failed';
                status.className = 'status disconnected';
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(sender, text, isLoading = false, isError = false) {
            const id = 'msg-' + Date.now();
            const div = document.createElement('div');
            div.className = 'message';
            div.id = id;

            let avatar, avatarClass, contentClass;
            
            if (sender === 'system') {
                avatar = '📎';
                avatarClass = '';
                contentClass = 'message-content context';
            } else {
                avatar = sender === 'user' ? '👤' : '🤖';
                avatarClass = sender === 'user' ? 'user-avatar' : 'ai-avatar';
                contentClass = isError ? 'message-content error' : 'message-content';
            }

            div.innerHTML = `
                <div class="message-avatar ${avatarClass}">${avatar}</div>
                <div class="${contentClass}">${isLoading ? text : escapeHtml(text)}</div>
            `;

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return id;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
